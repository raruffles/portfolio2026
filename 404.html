<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Página não encontrada · Raphael de Oliveira Lima</title>
  <link rel="icon" type="image/x-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <script>
    // Fallback: se o usuário digitou uma URL terminando em .htm, tentar redirecionar para .html caso exista
    (function() {
      var path = window.location.pathname;
      if (path.endsWith('.htm')) {
        var newPath = path.replace(/\.htm$/, '.html');
        window.location.replace(newPath);
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 520px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00e599;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -2px;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 16px;
    }
    p {
      color: #9e9ea7;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #00e599;
      color: #0b0c10;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 50px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 229, 153, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Erro 404</div>
    <h1>404</h1>
    <p>A página que você está procurando não existe ou o endereço é restrito.</p>
    <a href="https://raphaelolima.com.br/" class="btn">Voltar para o Início &rarr;</a>
  </div>
</body>
</html>
