<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="440" height="80" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 6)" filter="url(#shadow)">
    <!-- Hexagonal rounded shield -->
    <path d="M34 2 L60 17 L60 51 L34 66 L8 51 L8 17 Z" fill="url(#blueGrad)" rx="6"/>
    <!-- Inner electric bolt -->
    <path d="M37 12 L22 36 L33 36 L27 56 L47 30 L35 30 Z" fill="url(#amberGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Tech circuit dots -->
    <circle cx="16" cy="22" r="2.5" fill="#93C5FD"/>
    <circle cx="52" cy="46" r="2.5" fill="#93C5FD"/>
    <path d="M16 22 L22 28" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M52 46 L46 40" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="86" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#0F172A" letter-spacing="1.5">BRAGA</text>
  <rect x="220" y="24" width="2" height="24" rx="1" fill="#CBD5E1"/>
  <text x="232" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11.5" fill="#2563EB" letter-spacing="2.2">MANUTENÇÕES</text>
  <text x="232" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11.5" fill="#F59E0B" letter-spacing="2.2">ELÉTRICAS</text>
</svg>