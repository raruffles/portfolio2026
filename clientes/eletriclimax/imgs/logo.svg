<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  
  <!-- Icon Badge (Electric + Climate) -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal/Shield rounded container -->
    <rect x="0" y="0" width="100" height="100" rx="28" fill="#0F172A" stroke="#334155" stroke-width="2.5" />
    
    <!-- Climate Breeze Arc (Cyan) -->
    <path d="M 22 45 C 32 30, 68 28, 78 42 C 74 42, 60 36, 42 42 Z" fill="url(#coolGrad)" opacity="0.9" />
    <path d="M 24 68 C 36 82, 70 82, 78 68 C 70 70, 50 74, 34 68 Z" fill="url(#coolGrad)" opacity="0.9" />
    
    <!-- Central Lightning Bolt (Gold) -->
    <path d="M 54 16 L 36 54 L 50 54 L 46 84 L 66 46 L 52 46 Z" fill="url(#boltGrad)" filter="drop-shadow(0px 2px 4px rgba(245, 158, 11, 0.5))" />
    
    <!-- Tech Dot -->
    <circle cx="76" cy="30" r="3.5" fill="#38BDF8" />
  </g>
  
  <!-- Brand Typography -->
  <text x="135" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="40" fill="#0F172A" letter-spacing="-0.5">
    ELETRIC<tspan fill="#F59E0B">CLIMAX</tspan>
  </text>
  
  <!-- Sub-label -->
  <text x="137" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#0284C7" letter-spacing="2.5">
    ELÉTRICA • AR CONDICIONADO
  </text>
</svg>
