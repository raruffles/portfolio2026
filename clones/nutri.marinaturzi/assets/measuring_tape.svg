<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="tapeYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="tapeDropShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#12331C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Tape body with organic gentle wave -->
  <path d="M 10,65 Q 120,35 240,65 T 480,55 L 485,85 Q 360,95 240,95 T 10,95 Z" 
        fill="url(#tapeYellow)" 
        stroke="#CA8A04" 
        stroke-width="2" 
        filter="url(#tapeDropShadow)" />

  <!-- Metal tip left -->
  <rect x="8" y="65" width="12" height="30" rx="3" fill="#94A3B8" stroke="#475569" stroke-width="1.5" />
  <circle cx="14" cy="80" r="3" fill="#334155" />

  <!-- Tick marks and Centimeter Numbers -->
  <!-- 0 cm -->
